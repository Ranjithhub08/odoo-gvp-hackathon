name: FleetFlow CI

on:
  push:
    branches: [complete-fleetflow, main]
  pull_request:
    branches: [complete-fleetflow, main]

jobs:
  backend-build:
    name: Backend - Java Maven Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: cd backend && ./mvnw clean package -DskipTests --no-transfer-progress
      - name: Run tests
        run: cd backend && ./mvnw test --no-transfer-progress

  frontend-build:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: cd frontend && npm install
      - name: Lint
        run: cd frontend && npm run lint
      - name: Build
        run: cd frontend && npm run build
      - name: Run frontend tests
        run: cd frontend && npm test
